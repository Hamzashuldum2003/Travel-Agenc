<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Travel Agency</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <h1 class="auth-logo">🌍 Travel Agency</h1>
      <p class="auth-subtitle">أهلاً بعودتك! سجل دخولك للمتابعة</p>
    </div>

    <div id="error-message" class="error-message" style="display: none;"></div>
    <div id="success-message" class="success-message" style="display: none;"></div>

    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input 
          type="email" 
          name="email" 
          id="email" 
          placeholder="example@email.com"
          required 
        />
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input 
          type="password" 
          name="password" 
          id="password" 
          placeholder="••••••••"
          required 
          minlength="6"
        />
      </div>

      <button type="submit" class="btn-submit">
        <span class="btn-text">تسجيل الدخول</span>
        <span class="btn-loader" style="display: none;">⏳ جاري التحميل...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>ليس لديك حساب؟ <a href="/register">سجّل حساب جديد</a></p>
      <p><a href="/" class="back-link">← العودة للصفحة الرئيسية</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');
    const btnText = document.querySelector('.btn-text');
    const btnLoader = document.querySelector('.btn-loader');
    const submitBtn = document.querySelector('.btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // إخفاء رسائل الخطأ السابقة
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';
      
      // إظهار حالة التحميل
      btnText.style.display = 'none';
      btnLoader.style.display = 'inline';
      submitBtn.disabled = true;
      
      const formData = new FormData(form);
      const data = {
        email: formData.get('email'),
        password: formData.get('password')
      };

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: new URLSearchParams(data)
        });

        const result = await response.json();

        if (result.success) {
          successMessage.textContent = '✓ تم تسجيل الدخول بنجاح! جاري التحويل...';
          successMessage.style.display = 'block';
          
          // الانتقال للصفحة المناسبة حسب نوع المستخدم
          setTimeout(() => {
            window.location.href = result.redirect || '/dashboard';
          }, 1000);
        } else {
          errorMessage.textContent = '✗ ' + result.error;
          errorMessage.style.display = 'block';
          
          // إعادة تفعيل الزر
          btnText.style.display = 'inline';
          btnLoader.style.display = 'none';
          submitBtn.disabled = false;
        }
      } catch (error) {
        errorMessage.textContent = '✗ حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى';
        errorMessage.style.display = 'block';
        
        // إعادة تفعيل الزر
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
